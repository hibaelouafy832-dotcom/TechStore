<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Boutique Informatique</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/app.js"></script>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TechStore</a>
        </div>
    </nav>

    <header class="container py-4">
        <h1>Bienvenue chez TechStore</h1>
        <p>Votre boutique de matériel informatique</p>
    </header>

    <main class="container pb-5">

        <section id="indicateurs" class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Clients</h5>
                    <p id="total-clients">0</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Produits</h5>
                    <p id="total-produits">0</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Commandes</h5>
                    <p id="total-commandes">0</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card p-3">
                    <h5>Montant total</h5>
                    <p id="montant-total">0 DH</p>
                </div>
            </div>
        </section>

        <section class="card p-3 mb-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="recherche" class="form-label">Rechercher un client</label>
                    <input type="text" id="recherche" class="form-control"
                        placeholder="Saisir le nom du client">
                </div>

                <div class="col-md-3">
                    <label for="filtre-statut" class="form-label">Statut</label>
                    <select id="filtre-statut" class="form-select">
                        <option value="">Tous les statuts</option>
                        <option value="Livree">Livrée</option>
                        <option value="En attente">En attente</option>
                        <option value="Annulee">Annulée</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label for="filtre-categorie" class="form-label">Catégorie</label>
                    <select id="filtre-categorie" class="form-select">
                        <option value="">Toutes les catégories</option>
                    </select>
                </div>

                <div class="col-12">
                    <button type="button" id="reset-filtres" class="btn btn-secondary">
                        Réinitialiser les filtres
                    </button>
                </div>
            </div>
        </section>

        <div id="message-erreur" class="alert alert-danger d-none"></div>

        <section>
            <h2 class="mb-3">Liste des commandes</h2>
            <div id="liste-commandes" class="row g-3"></div>
        </section>

        <div class="modal fade" id="modal-details" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Détails de la commande</h5>
                        <button type="button" class="btn-close"
                            data-bs-dismiss="modal" aria-label="Fermer"></button>
                    </div>

                    <div class="modal-body" id="contenu-details"></div>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 TechStore - Boutique Informatique</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
